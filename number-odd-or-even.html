<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="password-cheaker">
        <input type="password" id="password-input" placeholder="enter the valid password">
        <button onclick="cheakpass()">Cheakpass</button>
    </div>

    <div class="displayarea" id="displayarea">

    </div>

</body>
<script>
    function cheakpass(){
    let input = document.getElementById("password-input");

    let display = document.getElementById("displayarea");

    let result=input.value;

    if(result % 2 == 0){
        display.innerText="even number ";
    } else{
        display.innerText="odd number";
    };
};
</script>
</html>
