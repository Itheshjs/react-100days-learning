<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>
    <style>
        .name-container {
    display: flex;
    gap: 10px;
    width: 400px;
}

.name-container input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.name-container button {
    padding: 10px 20px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

#displayArea {
    margin-top: 20px;
    width: 400px;
}

.name-item {
    padding: 12px;
    margin-bottom: 8px;
    background: #f1f1f1;
    border-radius: 5px;
}
    </style>
</head>

<body>
    <div class="name-container">
         <input type="text" id="nameInput" placeholder="enter the name ">
         <button onclick="addName()">add</button>
    </div>

    <div id="displayarea">
    </div>

</body>

<script>
    function addName() {

    let input = document.getElementById("nameInput");
    let displayarea = document.getElementById("displayarea");

    let name = input.value.trim();

    if (name === "") {
        alert("please enter the value");
        return;
    }

    // Create main div
    let newName = document.createElement("div");

    newName.classList.add("name-item");


    // Create name
    let nameText = document.createElement("span");

    nameText.textContent = name;


    // Create Edit button
    let editButton = document.createElement("button");

    editButton.textContent = "Edit";


    // Create Delete button
    let deleteButton = document.createElement("button");

    deleteButton.textContent = "Delete";


    // Add name and buttons
    newName.appendChild(nameText);
    newName.appendChild(editButton);
    newName.appendChild(deleteButton);


    // DELETE
    deleteButton.onclick = function () {

        newName.remove();

    };


    // EDIT
    editButton.onclick = function () {

        // Create input
        let editInput = document.createElement("input");

        editInput.type = "text";

        editInput.value = nameText.textContent;


        // Create Save button
        let saveButton = document.createElement("button");

        saveButton.textContent = "Save";


        // Create Cancel button
        let cancelButton = document.createElement("button");

        cancelButton.textContent = "Cancel";


        // Remove old content
        newName.innerHTML = "";


        // Show edit mode
        newName.appendChild(editInput);
        newName.appendChild(saveButton);
        newName.appendChild(cancelButton);


        // SAVE
        saveButton.onclick = function () {

            let updatedName = editInput.value.trim();

            if (updatedName === "") {
                alert("Name cannot be empty");
                return;
            }

            // Change name
            nameText.textContent = updatedName;


            // Show normal mode again
            newName.innerHTML = "";

            newName.appendChild(nameText);
            newName.appendChild(editButton);
            newName.appendChild(deleteButton);

        };


        // CANCEL
        cancelButton.onclick = function () {

            newName.innerHTML = "";

            newName.appendChild(nameText);
            newName.appendChild(editButton);
            newName.appendChild(deleteButton);

        };

    };


    // Add to display area
    displayarea.appendChild(newName);


    // Clear input
    input.value = "";

    input.focus();

}
</script>
</html>
